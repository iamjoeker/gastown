description = """
Clean stale sessions and garbage collect.

Dogs work through molecules (poured from this formula) to clean up dead sessions, orphaned processes, and
other system cruft. This is the garbage collector for Gas Town's runtime:
- Dead tmux sessions (no Claude process)
- Orphaned Claude processes (no tmux parent)
- Stale wisps past retention
- Leftover state files

## Dog Contract

This is infrastructure work. You:
1. Receive gc scope via hook_bead (aggressive or conservative)
2. Identify garbage across the system
3. Safely remove dead state
4. Report what was cleaned
5. Return to kennel

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| mode | hook_bead | GC mode: 'conservative' (safe) or 'aggressive' (thorough) |

## Safety

🚨 **THIS FORMULA IS HELD AT STEP `execute-gc`. (Mayor ruling 2026-08-22, hq-5dj0d, P0)**
**Slinging it is also prohibited.** See that step and hq-5dj0d for the reasons.

GC is destructive, and the reassurances that used to be in this section were
FALSE. Corrected:

- **`mode` does NOT bound the blast radius.** The `gt doctor --fix` call in
  `execute-gc` sits ABOVE the mode branch, so `mode=conservative` runs it in
  full. `mode` only gates the aggressive extras below it.
- **"Only obviously dead things" was wrong.** Unfiltered `gt doctor --fix` runs
  ~90 checks and mutates tracked config: it deletes tracked `settings.json`,
  rewrites `daemon.json`, and re-appends the Dolt section to the town
  `CLAUDE.md` (found duplicated and committed — hq-tiwt3).
- **It is not a session-GC tool.** Treating it as one is what made this formula
  look safe to dispatch every patrol cycle.

Steps 1 and 2 (detect/preview) are safe and may still be run for reporting.
Deleting is held."""
formula = "mol-session-gc"
version = 1

[squash]
trigger = "on_complete"
template_type = "work"
include_metrics = true

[[steps]]
id = "determine-mode"
title = "Determine GC mode"
description = """
Establish GC aggressiveness level.

**1. Check assignment:**
```bash
gt hook               # Shows mode in hook_bead
```

**2. Mode definitions:**

| Mode | Description | Risk |
|------|-------------|------|
| conservative | Only clearly dead state | Very low |
| aggressive | Includes stale state | Low but non-zero |

**Conservative targets:**
- tmux sessions with no processes
- Claude processes with no tmux parent
- Wisps > 24 hours old

**Aggressive additions:**
- Wisps > 1 hour old
- Branches with no matching polecat
- State files > 7 days old

**Exit criteria:** GC mode determined."""

[[steps]]
id = "preview-cleanup"
title = "Preview what will be cleaned"
needs = ["determine-mode"]
description = """
Identify garbage without removing it yet.

**1. Run doctor in preview mode:**
```bash
gt doctor -v
# Shows what would be cleaned, doesn't do it
```

**2. Parse doctor output for:**
- orphan-sessions: Tmux sessions to kill
- orphan-processes: Claude processes to terminate
- wisp-gc: Wisps to delete

**3. Additional scans (for aggressive mode):**
```bash
# Old branches
git branch --list 'polecat/*' | while read branch; do
  last_commit=$(git log -1 --format=%ct "$branch")
  # If > 7 days old and no matching polecat, candidate for cleanup
done

# Old runtime state files (stored under <rig>/.runtime/ as *.json).
# Prefer using `gt doctor -v` to enumerate stale state — it knows all locations.
find "$GT_TOWN_ROOT" -path "*/.runtime/*.json" -mtime +7 2>/dev/null
```

**4. Compile cleanup manifest:**
Record each item to be cleaned with:
- Type (session, process, wisp, branch, state)
- Identifier
- Age
- Reason for cleanup

**Exit criteria:** Cleanup manifest ready, nothing deleted yet."""

[[steps]]
id = "execute-gc"
title = "Execute garbage collection"
needs = ["preview-cleanup"]
description = """
🚨 **THIS STEP IS HELD IN EVERY MODE. DO NOT EXECUTE IT.**
**(Mayor ruling, re-issued 2026-08-22 as hq-5dj0d, P0. Supersedes the lost hq-6yx.)**

**1. PROHIBITED — do NOT run bare `gt doctor --fix`:**
```bash
# PROHIBITED — unfiltered, full-workspace, ~90 checks.
# Shown commented out ON PURPOSE so it is inert if copied verbatim.
# Do NOT uncomment. Do NOT reconstruct it by hand.
# gt doctor --fix
```

`mode` does NOT gate this line — it is above the mode branch, so
`mode=conservative` runs it in full. Unfiltered `gt doctor --fix` deletes tracked
`settings.json`, rewrites `daemon.json`, and re-appends the Dolt section to the
town `CLAUDE.md`, which is injected into every agent context — so the duplication
compounds on every run. That damage is already present and committed.

The comment "this handles sessions, processes, and wisps" understates the blast
radius: it also handles ~87 other checks, several of them destructive to tracked
config. It is not a session-GC tool.

**Until this step is scoped to specific checks, report the preview from
`preview-cleanup` and delete nothing.** Do not substitute another sweeping
command for it. If a dog reaches this step, it stops here and reports HELD.

The patrol formula's `session-gc` step no longer dispatches this molecule
(mol-deacon-patrol, step `session-gc`). If you were slung here, say so in your
report — that dispatch is itself prohibited.

**2. For aggressive mode, additional cleanup (ALSO HELD — the step is held as a whole):**
```bash
# Old branches (if aggressive mode)
git branch -D <old-branch>

# Old state files (if aggressive mode)
rm <state-file>
```

**3. Track what was deleted:**
Record each item actually removed for the report.

**Safety checks:**
- Never delete active sessions (tmux list-clients)
- Never delete branches with uncommitted polecat work
- Never delete wisps < 1 hour old

**Exit criteria:** Step reported as HELD. Nothing deleted."""

[[steps]]
id = "verify-cleanup"
title = "Verify cleanup was successful"
needs = ["execute-gc"]
description = """
Confirm garbage was actually removed.

**1. Re-run doctor to verify:**
```bash
gt doctor -v
# Should show no issues (or fewer issues)
```

**2. Check for stragglers:**
```bash
# Tmux sessions
tmux list-sessions 2>/dev/null

# Claude processes
pgrep -f claude

# Wisps
ls .beads-wisp/ 2>/dev/null | wc -l
```

**3. Compare before/after:**
- Sessions before: N → after: M
- Processes before: N → after: M
- Wisps before: N → after: M

**Exit criteria:** Cleanup verified."""

[[steps]]
id = "report-gc"
title = "Generate GC report"
needs = ["verify-cleanup"]
description = """
Create summary report of garbage collection.

**1. Generate report:**
```markdown
## Session GC Report: {{timestamp}}

**Mode**: {{mode}}

### Summary
| Type | Before | After | Cleaned |
|------|--------|-------|---------|
| Sessions | X | Y | Z |
| Processes | X | Y | Z |
| Wisps | X | Y | Z |
| Branches | X | Y | Z |
| State files | X | Y | Z |

### Items Cleaned
{{#each cleaned}}
- {{type}}: {{identifier}} (age: {{age}}, reason: {{reason}})
{{/each}}

### Errors
{{#if errors}}
{{#each errors}}
- {{item}}: {{error}}
{{/each}}
{{else}}
None
{{/if}}

### Space Recovered
~{{bytes_freed}} bytes
```

**2. Send to Deacon:**
```bash
gt mail send deacon/ -s "GC complete: {{total_cleaned}} items" \
  -m "{{report}}"
```

**Exit criteria:** Report sent."""

[[steps]]
id = "return-to-kennel"
title = "Signal completion and return to kennel"
needs = ["report-gc"]
description = """
Signal work complete and return to available pool.

**1. Signal completion to Deacon:**
```bash
gt mail send deacon/ -s "DOG_DONE $(hostname)" -m "Task: session-gc
Mode: {{mode}}
Items cleaned: {{total_cleaned}}
Space recovered: {{bytes_freed}}
Status: COMPLETE

Ready for next assignment."
```

**2. Return to kennel:**
Dog returns to available state in the pool.

**Exit criteria:** Deacon notified, dog ready for next work."""

[vars]
[vars.wisp_type]
description = "Type of wisp created for this molecule"
default = "gc_report"

[vars.mode]
description = "GC mode: 'conservative' or 'aggressive'"
default = "conservative"

[vars.age]
description = "Age of item being cleaned (computed during execution)"
default = ""

[vars.bytes_freed]
description = "Approximate bytes recovered (computed during execution)"
default = ""

[vars.error]
description = "Error message for a failed cleanup (computed during execution)"
default = ""

[vars.identifier]
description = "Identifier of item being cleaned (computed during execution)"
default = ""

[vars.item]
description = "Item that failed cleanup (computed during execution)"
default = ""

[vars.reason]
description = "Reason for cleanup (computed during execution)"
default = ""

[vars.report]
description = "Full GC report text (computed during execution)"
default = ""

[vars.timestamp]
description = "Timestamp of the GC run (computed during execution)"
default = ""

[vars.total_cleaned]
description = "Total number of items cleaned (computed during execution)"
default = ""

[vars.type]
description = "Type of item being cleaned (computed during execution)"
default = ""

description = """
Cross-cutting security concern: parallel security scanning of a change.

Each aspect examines the change from a different security angle. Run this
formula against implementation or submission diffs to catch vulnerabilities,
hardcoded secrets, and vulnerable dependencies before merge.
"""
formula = "security-audit"
type = "aspect"
version = 1

[[aspects]]
id = "secrets-scan"
title = "Secrets Scan"
focus = "Hardcoded secrets and credentials"
description = """
Review new and changed code for secrets/credentials in scope.

**Look for:**
- Hardcoded API keys, tokens, or passwords
- Credentials committed in config files or fixtures
- Private keys or certificates checked into the repo

**Questions to answer:**
- Would this leak a real secret if the diff were made public?
- Are secrets loaded from environment/config rather than embedded?
"""

[[aspects]]
id = "dependency-scan"
title = "Dependency Scan"
focus = "Known vulnerabilities in dependencies"
description = """
Check dependencies touched by this change for known vulnerabilities.

**Look for:**
- New or upgraded dependencies with known CVEs
- Pinned versions older than a known-fixed release

**Questions to answer:**
- Does this change introduce or retain a vulnerable dependency?
"""

[[aspects]]
id = "sast-scan"
title = "Static Analysis Scan"
focus = "Vulnerabilities and OWASP Top 10 issues in new code"
description = """
Scan new code for vulnerabilities (SAST). Review for OWASP Top 10 issues.

**Look for:**
- Injection vulnerabilities (SQL, XSS, command, LDAP)
- Authentication/authorization bypasses
- Insecure cryptographic usage
- Path traversal, SSRF, deserialization vulnerabilities

**Questions to answer:**
- What can a malicious user do with this code?
- Are there defense-in-depth gaps?
"""

[[aspects]]
id = "pre-merge-verification"
title = "Pre-Merge Security Verification"
focus = "Final vulnerability confirmation before merge"
description = """
Final vulnerability scan before merge. Confirm no new vulnerabilities were
introduced by the change as a whole.

**Questions to answer:**
- Do the findings from the other aspects block this merge?
- Has anything changed since those aspects ran that needs a re-scan?
"""

description = """
Mayor's daemon patrol loop.

The Deacon is the Mayor's background process that runs continuously, handling callbacks, monitoring rig health, and performing cleanup. Each patrol cycle runs these steps in sequence, then loops or exits.

## Idle Town Principle

**The Deacon should be silent/invisible when the town is healthy and idle.**

- Skip HEALTH_CHECK nudges when no active work exists
- Sleep 60+ seconds between patrol cycles (longer when idle)
- Let the feed subscription wake agents on actual events
- The daemon (10-minute heartbeat) is the safety net for dead sessions

This prevents flooding idle agents with health checks every few seconds.

## Mayor Nudge Policy

**NEVER nudge the Mayor for health checks, pings, or routine status.**
The Mayor should ONLY be nudged for genuine emergencies:
- Escalations that require Mayor decision-making
- Sending mail to mayor/ (which is non-interruptive)

Health pings to the Mayor are a ZFC violation — they burn Mayor context
on ceremony instead of work. The Mayor is your boss, not a subordinate
to be monitored. Use `gt mail send mayor/` for non-urgent communication.

## Second-Order Monitoring

Witnesses passively monitor Deacon health by checking the Deacon's agent bead
last_activity timestamp. This prevents the "who watches the watchers" problem —
if the Deacon dies, Witnesses detect it and escalate to the Mayor.

No WITNESS_PING mail is sent. Witnesses observe the Deacon's last_activity
timestamp instead, and only send an alert to the Mayor if the Deacon appears
unresponsive. This avoids heartbeat mail spam.

"Unresponsive" is NOT five minutes. The Deacon stamps its heartbeat at fixed
points in this cycle and then parks in await-signal for up to `--backoff-max`
(15m), so the age ramps from zero to the cycle length and resets: it reports
where in the loop the Deacon is, not whether it is alive. Measured over 30
consecutive cycles, mean 604s and max 957s, a 5-minute rule fired on 29 of them
— 50.7% of wall-clock — and three separate agents raised a wedge alarm on the
same healthy Deacon in one day off exactly that signal (gt-cbd).

Use the daemon's own thresholds, which are the calibrated ones: stale at 15m,
very-stale at 20m (`operational.deacon.heartbeat_*_threshold`). Age alone still
carries little information in the stale band — before escalating, check
`gt deacon status --json` for `verdict: wedged`, which additionally requires no
turn in flight and no await pending.

## Verification Sweeps (gt-emm)

**Any census you produce over working trees must be produced by a
gitignore-blind traversal. A recursive `grep` is not one.**

The agent shell shadows `grep` with `ugrep --ignore-files`, so every recursive
search honors `.gitignore` — and the town gitignores `polecats/`, `mayor/`,
`refinery/`, `crew/` and `deacon/dogs/`, which is where every checkout lives.
Measured: `find` + per-file grep found 16 stale files where `grep -rl` over the
same root found 0. The sweep did not merely miss some; it returned a perfect
all-clear. A correct probe string delivered by a blind traversal still yields a
false clean.

The blindness is exactly correlated with risk: working clones are gitignored
BECAUSE they are derived, and derived copies are where stale content lives.

**Required for any "N found" or "clean" claim about a tree:**

```bash
scripts/town-sweep.sh -r "$GT_ROOT" -i '<glob>' '<pattern>'
# or, by hand:
find "$GT_ROOT" -type d -name .git -prune -o -type f -print0 \\
  | xargs -0 grep -l -F -e '<pattern>' --
```

Exit code 2 from the script means coverage could not be guaranteed. Treat it as
UNKNOWN, never as clean.

**Report the traversal with the count.** A bare "0 found" is not a result — it is
indistinguishable from a blind sweep. Include the tool, the number of files
scanned, and the control outcome:

```
census: N files match '<pattern>' under <root>
traversal: scripts/town-sweep.sh (gitignore-blind)   scanned: 767 files
controls: --self-test 2 passed, 0 failed
```

**A count of zero deserves more scrutiny than a count of many** — zero is what
the defect produces.

**Controls must be planted INSIDE the ignored subtree.** A positive control that
fires outside one validates the probe in a frame where the defect cannot appear,
and certifies nothing. This has already happened here: a control was run, it
fired, and it proved nothing, because the canary landed in a scratchpad outside
any `.gitignore`. Use `scripts/town-sweep.sh --self-test`, which builds its
fixture inside a gitignored subtree and also asserts the negative half (a
gitignore-aware search MISSES the canary). Never plant a live canary inside
another agent's sandbox.

Full recipe: `docs/guides/verification-sweeps.md`.

## Abbreviated Patrol Mode (Idle Effort Tuning)

When `await-signal` outputs `EFFORT: reduced`, run an ABBREVIATED patrol.
This happens when idle_cycles >= {{idle_effort_threshold}} (no activity detected).

Abbreviated patrol rules:
- **heartbeat**: ALWAYS run (required by daemon).
- **inbox-check**: Run `gt mail drain` only. Skip individual message processing unless drain reports unprocessed HELP or RECOVERED_BEAD messages.
- **orphan-process-cleanup**: SKIP.
- **test-pollution-cleanup**: SKIP.
- **gate-evaluation**: SKIP.
- **dispatch-gated-molecules**: SKIP.
- **check-convoy-completion**: SKIP.
- **resolve-external-deps**: SKIP.
- **fire-notifications**: SKIP.
- **heartbeat-mid**: SKIP (short cycle doesn't need mid-cycle refresh).
- **health-scan**: Quick `gt witness status` / `gt refinery status` only. Skip nudges.
- **dolt-health**: SKIP.
- **zombie-scan**: SKIP.
- **plugin-run**: SKIP.
- **dog-pool-maintenance**: SKIP.
- **dog-health-check**: SKIP.
- **orphan-check**: SKIP.
- **session-gc**: SKIP.
- **wisp-compact**: SKIP.
- **compact-report**: SKIP.
- **costs-digest**: SKIP (already disabled).
- **patrol-digest**: SKIP.
- **log-maintenance**: SKIP.
- **patrol-cleanup**: Quick inbox check only.
- **context-check**: Quick self-assessment (one sentence).
- **loop-or-exit**: Normal (await-signal as usual).

When `await-signal` outputs `EFFORT: full`, run all steps thoroughly (normal mode).

The goal: idle cycles should burn ~10% of the tokens a full patrol uses."""
formula = "mol-deacon-patrol"
version = 22

[vars]
[vars.wisp_type]
description = "Type of wisp created for this molecule"
default = "patrol"

[vars.idle_effort_threshold]
description = "Idle cycles before switching to abbreviated patrol (0 = always full)"
default = "1"

[[steps]]
id = "heartbeat"
title = "Refresh heartbeat"
description = """
Signal liveness to the daemon.

The daemon monitors `deacon/heartbeat.json` and kills the Deacon if it goes stale
(>20 minutes without update). Refresh the heartbeat at the start of every patrol cycle
so the daemon knows we are alive.

```bash
gt deacon heartbeat "starting patrol cycle"
```

This MUST run before any other step. Skipping it risks the daemon killing a healthy
Deacon mid-cycle."""

[[steps]]
id = "inbox-check"
title = "Handle callbacks from agents"
needs = ["heartbeat"]
description = """
🚨 **WISP GC IS SUSPENDED — run NO variant of `bd mol wisp gc`, and do not reconstruct one from memory.** There is deliberately no command in this step.
```bash
# wisp GC SUSPENDED (bd-czf): --closed --force deletes closed wisps with no age threshold
```

`--closed --force` purges ALL closed wisps with NO age threshold, and all agent mail is a
wisp — verified 2026-08-02 by controlled experiment: of 80 closed beads, 71 were deleted
and 9 kept, every deleted id containing `-wisp-` and no survivor doing so. Over half of a
typical sweep is correspondence, so a bare gc silently destroys the citation record while
reporting an accurate deletion count. Run from a RIG-scoped database it also reaches
merge-request beads, and an MR CLOSED WITHOUT MERGING is the only record that work was
pushed and never landed — nothing reconciles it afterwards.

🚨 **NEVER run `bd mol wisp gc --age`.** It has NO ownership filter and deletes any OPEN
wisp older than the age window, including other agents' merge requests. NEITHER variant is
safe.

> **Warning (hq-3pp):** Do not run unscoped age-based wisp GC from inside
> this patrol. Active patrol step wisps can be older than 1h before they run;
> age cleanup can reap this molecule's open steps and make the patrol appear
> complete early. **Closed-only cleanup is NOT the safe alternative** — this
> warning previously read "use closed-only cleanup here", which endorsed
> `bd mol wisp gc --closed --force`; that variant is destructive for the separate
> reason above and is suspended (bd-czf). Wisp cleanup of either kind belongs
> outside active patrol molecules.

If your town provides `deacon/preserve-then-gc.sh`, that wrapper is the only sanctioned
route: it dumps full content to `deacon/evidence/` and appends to `INDEX.tsv` BEFORE
deleting, and aborts the gc if preservation fails. It still DELETES, and it is hq-scoped —
it cannot protect `bd-`/`gt-` prefixed beads, so it is safe only from the hq-scoped Deacon
context and must never be run against a rig database. A fresh town has no such wrapper and
this step does not create one. Report stale wisps to the reaper Dog instead of GC-ing them.

**Where that wrapper exists, run it ONLY in its preserve half, with the flag spelled out:**
```bash
bash $GT_ROOT/deacon/preserve-then-gc.sh --preserve-only
```

**Pass `--preserve-only` explicitly. Do NOT rely on the script default.** The
default was inverted to preserve-only on 2026-08-18; a bare run happens to print
HELD today only because of that. If the default ever regresses, a bare invocation
silently re-arms the patrol-2682 breach and this step still reads as correct. The
flag must be on the dangerous side of the call, not in the operator's memory.
The gc half of this script is HELD under the bd-czf hold (hq-6y9dp, P0).

Dead wisp citations resolve via `bash $GT_ROOT/deacon/evidence/resolve.sh <id>`. Note this
preserves the EVIDENCE but does not restore the CITATION MECHANISM — `bd show` still fails,
so prefer citing non-wisp bead ids, which are never deleted.

Then handle callbacks from agents.

Check the Mayor's inbox for messages from:
- Witnesses reporting polecat status
- Refineries reporting merge results
- Polecats requesting help or escalation
- External triggers (webhooks, timers)

```bash
gt mail inbox
# For each message:
gt mail read <id>
# Handle based on message type
```

**HELP / Escalation**:
Assess and handle or forward to Mayor.
Archive after handling:
```bash
gt mail archive <message-id>
```

**LIFECYCLE messages**:
Polecats reporting completion, refineries reporting merge results.
Archive after processing:
```bash
gt mail archive <message-id>
```

**DOG_DONE messages**:
Dogs report completion after infrastructure tasks (orphan-scan, session-gc, etc.).
Subject format: `DOG_DONE <hostname>`
Body contains: task name, counts, status.
```bash
# Parse the report, log metrics if needed
gt mail read <id>
# Archive after noting completion
gt mail archive <message-id>
```
Dogs return to idle automatically. The report is informational - no action needed
unless the dog reports errors that require escalation.

**CONVOY_NEEDS_FEEDING messages** (from Refinery):
The daemon's ConvoyManager handles convoy feeding (event-driven, 5s poll).
Simply archive these messages — no deacon action needed.
```bash
# For each CONVOY_NEEDS_FEEDING message:
gt mail read <id>
gt mail archive <message-id>
```

**RECOVERED_BEAD messages** (from Witness):
When a Witness detects a dead polecat with abandoned work, it resets the bead
to open status and sends a RECOVERED_BEAD mail. The Deacon auto re-dispatches:
Subject format: `RECOVERED_BEAD <bead-id>`
```bash
# For each RECOVERED_BEAD message:
gt mail read <id>
# Extract bead ID from subject
gt deacon redispatch <bead-id>
gt mail archive <message-id>
```

The `redispatch` command handles:
- Rate-limiting (5-minute cooldown between re-dispatches of same bead)
- Failure tracking (after 3 failures, escalates to Mayor instead of re-slinging)
- Auto-detection of target rig from bead prefix
- Skipping beads that were already claimed by another polecat

Exit codes: 0=dispatched, 2=cooldown, 3=skipped. Non-zero non-error codes are
informational - archive the message regardless.

Callbacks may spawn new polecats, update issue state, or trigger other actions.

**Hygiene principle**: Archive messages after they're fully processed.
Keep inbox near-empty - only unprocessed items should remain."""

[[steps]]
id = "orphan-process-cleanup"
title = "Clean up orphaned claude subagent processes"
needs = ["inbox-check"]
description = """
Clean up orphaned claude subagent processes.

Claude Code's Task tool spawns subagent processes that sometimes don't clean up
properly after completion. These accumulate and consume significant memory.

**Detection method:**
Orphaned processes have no controlling terminal (TTY = "?"). Legitimate claude
instances in terminals have a TTY like "pts/0".

**Run cleanup:**
```bash
gt deacon cleanup-orphans
```

This command:
1. Lists all claude/codex processes with `ps -eo pid,tty,comm`
2. Filters for TTY = "?" (no controlling terminal)
3. Resolves each candidate's Gas Town workspace root (shown as `town=` in output)
4. Sends SIGTERM to each orphaned process
5. Reports how many were killed, with their town affiliation

**Multi-town awareness:**
Multiple Gas Town instances may share the same machine, each with its own tmux
socket and agent processes. `ps` output shows Claude processes from ALL towns,
but each town's deacon should only clean up processes belonging to its own town.

- The `gt deacon cleanup-orphans` output shows `town=<path>` for each orphan
- Only clean up processes where the town path matches this town's root (`$GT_ROOT`)
- Processes belonging to other towns are managed by those towns' own deacons
- If you use manual process inspection (`ps aux`), verify a process's working
  directory is under this town's root before killing it

**Why this is safe:**
- Processes in terminals (your personal sessions) have a TTY - they won't be touched
- Only kills processes that have no controlling terminal
- These orphans are children of the tmux server with no TTY, indicating they're
  detached subagents that failed to exit

**If cleanup fails:**
Log the error but continue patrol - this is best-effort cleanup.

**Exit criteria:** Orphan cleanup attempted (success or logged failure)."""

[[steps]]
id = "test-pollution-cleanup"
title = "Detect and clean runtime test pollution"
needs = ["inbox-check"]
description = """
Detect and clean runtime pollution left by tests and dead processes.

This step cleans up four categories of pollution, plus one report-only survey. **Only clean items where the
owning process is confirmed dead** — never kill or remove resources owned by
live processes.

**1. Rogue dolt servers**

Any `dolt sql-server` process that holds this workspace's configured port
(set via `GT_DOLT_PORT`, default 3307) but uses a different data directory
is an "imposter" — a leaked server from another workspace. Kill and log.

```bash
# Use gt dolt kill-imposters which checks data-dir — safe for multi-workspace setups
gt dolt kill-imposters 2>/dev/null || true
```

**2. Stranded build and test scratch dirs**

Reclaim orphaned scratch directories from TMPDIR: Go toolchain work directories
(`go-build<n>`, `go-link-<n>`), beads test fixtures (`beads-test-dolt-*`,
`beads-bd-tests-*`), and beads hermetic environment roots (`beads-test-env-*`).
All are created per invocation and removed on normal exit; a KILLED run — OOM
killer, test timeout, polecat recycle — strands them, at 100-300MB a time for
the Go ones and about 201MB for each environment root, which carries a private
build of the bd binary.

Where TMPDIR is a RAM-backed tmpfs this exhausts the filesystem: 34 stranded
work directories held 5.35GB of a 31GB tmpfs on 2026-08-19, and gastown's own
disk-space guard began refusing polecat creation with `insufficient disk space`
while `df /` still reported 1.3TB free, because /tmp is a different filesystem
(gt-yb33). The error names disk space rather than the test, so it reads as a
code regression to whichever agent hits it next.

```bash
gt deacon sweep-tmp --json
```

The command owns the safety rules. It removes only directories whose name is
exactly a member of a known family, that are real directories owned by this
user, whose whole tree is readable and has been untouched for `--min-age`
(default 1h), and that no running process is using — by naming the path in its
argv, by having it as its working directory, or by holding an open file
descriptor inside it. If the process table cannot be read it removes NOTHING,
however old the directories look. It never touches agent scratchpads, PID
files, or anything it did not positively identify.

Read `removed` and `removed_bytes` from the JSON for the digest. A true
`inconclusive` means the sweep refused for lack of evidence — report it, do not
work around it. A non-zero `opaque_processes` is a named gap in coverage, not a
failure: some processes will not publish their working directory or open files
even to their owner, so only their command lines were searched.

**DO NOT REIMPLEMENT THIS IN SHELL (gt-1gdh, gt-32z, gt-hkv).** This step used
to be two inline blocks, and the beads-fixture half was an `rm -rf` guarded by
`lsof`. It failed OPEN for months. The form was
`if ! lsof +D "$dir" >/dev/null 2>&1; then rm -rf "$dir"; fi`, i.e. "delete when
lsof exits non-zero". Measured on a host with docker mounts:

```
lsof +D <dir with 23 live handles on a running dolt server>   -> exit 1, correct STDOUT
lsof +D <empty, nothing open>                                 -> exit 1, empty STDOUT
lsof +D <directory we cannot read>                            -> exit 1, empty STDOUT
lsof not installed                                            -> exit 127
```

Every failure mode exits non-zero, so the test read every one of them as
permission to `chmod -R u+w` and `rm -rf`. It would have destroyed a live Dolt
server's `.dolt/` — the exact unrecoverable corruption the town CLAUDE.md
forbids — plus 1.6GB of a named polecat's in-flight P0 test fixtures. It never
fired only because of a SECOND, unrelated bug: `for dir in A* B*` under zsh
aborts the whole statement when `A*` matches nothing, so the loop ran zero
iterations. Repairing the glob alone — the natural, obviously-correct-looking
fix — would have armed the destruction on its first run.

The repaired shell version worked by carefully NOT trusting lsof's exit status.
`gt deacon sweep-tmp` reads /proc instead, where there is no status to misread,
and where the same walk answers cwd and open descriptors as well as argv. The
logic is Go with real unit tests against real fixtures (TestSweepRejectsDangerousRoots,
TestScanRefusesSymlink, TestSweepSkipsWorkDirOfARunningBuild,
TestSweepRefusesADirWithAnOpenFileDescriptor and its control) instead of prose
in a TOML file that no test can reach.

**This is a symptom, not the disease.** Something is killing builds and suites
often enough to strand dozens of directories in three days. If `removed` is
routinely high, that is worth an investigation of its own (OOM killer, test
timeouts, mid-build recycles), not a bigger sweep.

**3. Agent scratchpad directories**

The other half of the same tmpfs. Every Claude Code session gets a private
working directory under `$TMPDIR/claude-<uid>/`, and nothing removes it when the
session ends: 2654 of them held 13.7GB of the same 31GB tmpfs on 2026-08-19,
against 5.35GB of stranded Go work directories (gt-h0jb).

**Report only. Do not pass `--apply` from patrol.**

```bash
gt deacon sweep-scratchpads --json
```

Read `sweepable`, `sweepable_bytes`, `used_percent` and `triggered` for the
digest. `triggered` true means the filesystem is above the high-water mark and a
sweep would act — escalate that with the numbers rather than applying it here.
Deleting another agent's working files is irreversible and belongs to an
operator who has read a real report, not to a patrol step.

Age is NOT the rule here and a shell one-liner cannot substitute for the
command. A live agent's scratchpad can sit untouched for hours while it thinks —
2 of 15 live sessions had been quiet for over 2h when this was measured, one of
them for 4.7h — so an age-only `find -delete` destroys live work. The command
proves death by conjunction (birth time versus live process start times, working
directories, transcript activity, a forensic floor) and keeps anything it cannot
prove dead. See `docs/scratchpad-retention.md`.

**4. Stale PID/lock files**

Remove test-server PID files whose process is PROVEN dead. Same discipline as
sub-section 2, one blast radius smaller: alive beats every probe, and a probe
that cannot answer is a refusal, not permission.

```bash
TMPDIR="${TMPDIR:-/tmp}"
STALE_PIDFILES=0

while IFS= read -r pidfile; do
  [ -f "$pidfile" ] || continue
  PID=$(cat "$pidfile" 2>/dev/null)

  # A PID we cannot read, or that is not a plain number, is not evidence of death.
  case "$PID" in
    ''|*[!0-9]*)
      echo "REFUSING (PID file unreadable or non-numeric): $pidfile"
      continue
      ;;
  esac

  # kill -0's EXIT STATUS cannot tell "dead" from "alive but owned by another
  # user" — both are non-zero. Only rc=0 is unambiguous, and it means alive.
  kill_err=$(LC_ALL=C kill -0 "$PID" 2>&1) && continue

  proven_dead=0
  case "$kill_err" in
    *"No such process"*) proven_dead=1 ;;   # ESRCH: the one message that proves death
  esac

  # /proc, where it exists, is owner- and language-independent: present means
  # alive no matter who owns the process, absent means dead.
  if [ -d /proc/1 ]; then
    if [ -e "/proc/$PID" ]; then
      echo "Keeping (PID $PID is alive, owned by another user): $pidfile"
      continue
    fi
    proven_dead=1
  fi

  if [ "$proven_dead" -ne 1 ]; then
    echo "REFUSING (cannot prove PID $PID is dead: $kill_err): $pidfile"
    continue
  fi

  rm -f "$pidfile" && {
    echo "Removed stale PID file: $(basename "$pidfile") (PID=$PID dead)"
    STALE_PIDFILES=$((STALE_PIDFILES + 1))
  }
done <<EOF
$(find "$TMPDIR" -mindepth 1 -maxdepth 1 -type f -name 'dolt-test-server-*.pid' 2>/dev/null
  find "$TMPDIR" -mindepth 1 -maxdepth 1 -type f -name 'beads-test-dolt-*.pid' 2>/dev/null)
EOF
echo "stale_pidfiles=$STALE_PIDFILES"
```

**WHY THIS GUARD IS SHAPED THIS WAY (gt-hkv) — DO NOT SIMPLIFY IT.** The previous
version was `for pidfile in /tmp/A-*.pid /tmp/B-*.pid; do ... if ! kill -0 "$PID"`,
and it carried both halves of the gt-32z defect pattern:

- **It could not run.** Two globs in one `for` list: under zsh, an unmatched
  `/tmp/dolt-test-server-*.pid` aborts the whole statement, so the loop ran zero
  iterations and the second pattern was never reached. Measured here: zsh 5.9.2
  prints `no matches found` and executes nothing; bash iterates. The `find` form
  above removes the dependency on shell glob semantics.
- **If it had run, it would have failed OPEN.** `! kill -0 "$PID"` reads as "the
  process is dead", but `kill -0` also fails when the process EXISTS and belongs
  to another user. Measured on this host:

```
kill -0 <our own live pid>   -> rc=0, no output
kill -0 1  (root-owned, alive) -> rc=1, "Operation not permitted"   ALIVE
kill -0 999999 (unallocated)   -> rc=1, "No such process"           dead
```

  Alive-but-foreign and dead are the same exit status. The old test deleted a
  live foreign test server's PID file as "stale" — and repairing the glob alone
  is what would have armed it, exactly as sub-section 2 warns.

**Never restore an exit-status-only `kill -0` test here, and never re-add a bare
glob `for` loop over these patterns.**

**5. Dead dog worktrees**

If a dog's tmux session is dead but worktree dirs remain, prune them.

**REPORT ONLY — NO REMOVAL AUTHORITY.** This step detects and reports dead dog
worktrees. It does NOT delete them. See the warning below before changing that.

```bash
# For each dog directory. GT_ROOT, not ~/gt — see warning below.
DEAD_WORKTREES=0
for dogdir in "${GT_ROOT:?GT_ROOT must be set}"/deacon/dogs/*/; do
  [ -d "$dogdir" ] || continue
  DOG=$(basename "$dogdir")
  # Check if dog has a live tmux session
  if ! tmux has-session -t "dog-$DOG" 2>/dev/null; then
    # Dog session is dead - check for leftover worktree dirs
    for rigrepo in "$dogdir"*/; do
      [ -d "$rigrepo/.git" ] || continue
      git -C "$rigrepo" worktree list 2>/dev/null
      echo "Dead dog worktree: $DOG/$(basename "$rigrepo") (session dead)"
      DEAD_WORKTREES=$((DEAD_WORKTREES + 1))
    done
  fi
done
echo "dead_worktrees=$DEAD_WORKTREES (reported, NOT pruned)"
```

If `dead_worktrees` is non-zero, REPORT the count in the patrol digest and, if it
stays non-zero across several patrols, escalate. Do not delete.

**WHY THIS STEP HAS NO DELETE AUTHORITY (gt-3sz, hq-uwxo).** It used to run
`git worktree remove --force` over every dead dog's repos. That was harmless only
by accident: it iterated `~/gt/deacon/dogs/*/`, and `~/gt` is not the town root on
this host, so the glob matched nothing and the loop body never ran. Repointing the
path to the real root — the obviously correct typo fix, and one a competent agent
would make without hesitation — would have force-removed worktrees holding **2 of
the 3 surviving local copies** of commit `5b6b05e8be92`, the P0 merge record the
town was holding a GC suspension to protect, and which sits on 0 of 189 remote
refs. The naive fix WAS the harm.

The path is now correct, so this step actually runs. It is safe to run because it
only counts. **If you restore deletion here, you re-arm exactly that hazard** —
a worktree is frequently the only thing holding a commit reachable. Prefer a tag
(`preserve/*`) plus an explicit human decision over any automated prune.

**6. Report**

Log counts of cleaned items. If any items were cleaned, include counts in a
brief summary for the patrol digest:

```
Test pollution cleanup: rogue_dolt=N tmp_dirs=N scratchpads=N stale_pids=N dead_worktrees=N
```

If all counts are 0, log "Test pollution cleanup: clean" and move on.

**Safety:**
- NEVER kill this workspace's own legitimate dolt server (checked via data-dir)
- NEVER remove a temp directory some process is using — and decide that from
  /proc via `gt deacon sweep-tmp`, never from lsof's exit status (gt-32z)
- NEVER treat a check that could not run — missing tool, unreadable directory,
  non-zero status from a tool that also warns about unrelated filesystems — as
  permission to delete. Absence of a signal is not a clean bill of health.
  Every such path must REFUSE and log why.
- NEVER remove PID files where the PID is still alive
- NEVER prune worktrees for dogs with live tmux sessions

**Exit criteria:** All dead-process pollution cleaned and counts logged."""

[[steps]]
id = "gate-evaluation"
title = "Evaluate pending async gates"
needs = ["inbox-check"]
description = """
Evaluate pending async gates.

Gates are async coordination primitives that block until conditions are met.
The Deacon is responsible for monitoring gates and closing them when ready.

**Timer gates** (await_type: timer):
Check if elapsed time since creation exceeds the timeout duration.

```bash
# List all open gates
bd gate list --json

# For each timer gate, check if elapsed:
# - CreatedAt + Timeout < Now → gate is ready to close
# - Close with: bd gate close <id> --reason "Timer elapsed"
```

**GitHub gates** (await_type: gh:run, gh:pr) - handled in separate step.

**Human/Mail gates** - require external input, skip here.

After closing a gate, the Waiters field contains mail addresses to notify.
Send a brief notification to each waiter that the gate has cleared."""

[[steps]]
id = "dispatch-gated-molecules"
title = "Dispatch molecules with resolved gates"
needs = ["gate-evaluation"]
description = """
Find molecules blocked on gates that have now closed and dispatch them.

This completes the async resume cycle without explicit waiter tracking.
The molecule state IS the waiter - patrol discovers reality each cycle.

**Step 1: Find gate-ready molecules**
```bash
bd ready --gated --json
```

This returns molecules where:
- Status is in_progress
- Current step has a gate dependency
- The gate bead is now closed
- No polecat currently has it hooked

**Step 2: For each ready molecule, dispatch to the appropriate rig**
```bash
# Determine target rig from molecule metadata
bd mol show <mol-id> --json
# Look for rig field or infer from prefix

# Dispatch to that rig's polecat pool
gt sling <mol-id> <rig>/polecats
```

**Step 3: Log dispatch**
Note which molecules were dispatched for observability:
```bash
# Molecule <mol-id> dispatched to <rig>/polecats (gate <gate-id> cleared)
```

**If no gate-ready molecules:**
Skip - nothing to dispatch. Gates haven't closed yet or molecules
already have active polecats working on them.

**Exit criteria:** All gate-ready molecules dispatched to polecats."""

[[steps]]
id = "check-convoy-completion"
title = "Check convoy completion"
needs = ["inbox-check"]
description = """
Check convoy completion status.

Convoys are coordination beads that track multiple issues across rigs. When all tracked issues close, the convoy auto-closes.

**IMPORTANT**: Use `gt convoy` commands (not `bd list`) because convoys are stored in
town-level HQ beads and the Deacon runs from `$GT_ROOT/deacon/`. The `gt` commands are
town-aware and will find convoys regardless of current directory.

**Step 1: Find open convoys**
```bash
gt convoy list
```

**Step 2: Check and auto-close completed convoys**
```bash
gt convoy check
```

This command:
- Finds all open convoys
- Checks if all tracked issues are closed (handles cross-rig resolution)
- Auto-closes convoys where all tracked work is complete
- Sends notifications to convoy owners

If `gt convoy check` times out while `gt dolt status` is healthy, treat it as a
control-plane wait timeout, not a Dolt outage. Escalate at MEDIUM at most and use
a stable fingerprint such as `deacon:convoy-check:<convoy-id>` so repeated patrols
do not create duplicate alerts. Reserve HIGH/CRITICAL for evidence that Dolt is
unreachable or down.

**Note**: Convoys support cross-prefix tracking (e.g., hq-* convoy can track gt-*, bd-* issues).
The `gt convoy` commands handle cross-rig issue resolution automatically.

Stranded convoy feeding is handled by the daemon's ConvoyManager (event-driven + 30s periodic scan).
The deacon no longer feeds convoys directly — this avoids double-dispatch races between deacon dogs and daemon."""

[[steps]]
id = "resolve-external-deps"
title = "Resolve external dependencies"
needs = ["check-convoy-completion"]
description = """
Resolve external dependencies across rigs.

When an issue in one rig closes, any dependencies in other rigs should be notified. This enables cross-rig coordination without tight coupling.

**Step 1: Check recent closures from feed**
```bash
gt feed --since 10m --plain | grep "✓"
# Look for recently closed issues
```

**Step 2: For each closed issue, check cross-rig dependents**
```bash
bd show <closed-issue>
# Look at 'blocks' field - these are issues that were waiting on this one
# If any blocked issue is in a different rig/prefix, it may now be unblocked
```

**Step 3: Update blocked status**
For blocked issues in other rigs, the closure should automatically unblock them (beads handles this). But verify:
```bash
bd blocked
# Should no longer show the previously-blocked issue if dependency is met
```

**Cross-rig scenarios:**
- bd-xxx closes → gt-yyy that depended on it is unblocked
- External issue closes → internal convoy step can proceed
- Rig A issue closes → Rig B issue waiting on it proceeds

No manual intervention needed if dependencies are properly tracked - this step just validates the propagation occurred."""

[[steps]]
id = "fire-notifications"
title = "Fire notifications"
needs = ["resolve-external-deps"]
description = """
Fire notifications for convoy and cross-rig events.

After convoy completion or cross-rig dependency resolution, notify relevant parties.

**Convoy completion notifications:**
When a convoy closes (all tracked issues done), notify the Overseer:
```bash
# Convoy gt-convoy-xxx just completed
gt mail send mayor/ -s "Convoy complete: <convoy-title>" \\
  -m "Convoy <id> has completed. All tracked issues closed.
      Duration: <start to end>
      Issues: <count>

      Summary: <brief description of what was accomplished>"
```

**Cross-rig resolution notifications:**
When a cross-rig dependency resolves, notify the affected rig:
```bash
# Issue bd-xxx closed, unblocking gt-yyy
gt mail send gastown/witness -s "Dependency resolved: <bd-xxx>" \\
  -m "External dependency bd-xxx has closed.
      Unblocked: gt-yyy (<title>)
      This issue may now proceed."
```

**Notification targets:**
- Convoy complete → mayor/ (for strategic visibility)
- Cross-rig dep resolved → <rig>/witness (for operational awareness)

Keep notifications brief and actionable. The recipient can run bd show for details."""

[[steps]]
id = "heartbeat-mid"
title = "Mid-cycle heartbeat refresh"
needs = ["orphan-process-cleanup", "test-pollution-cleanup", "dispatch-gated-molecules", "fire-notifications"]
description = """
Refresh the heartbeat mid-cycle to prevent the daemon from killing us during long patrols.

```bash
gt deacon heartbeat "mid-cycle checkpoint"
```"""

[[steps]]
id = "health-scan"
title = "Check Witness and Refinery health"
needs = ["heartbeat-mid"]
description = """
Check Witness and Refinery health for each rig.

**IMPORTANT: Skip DOCKED/PARKED rigs**
Before checking any rig, verify its operational state:
```bash
gt rig status <rig>
# Check the Status: line - if DOCKED or PARKED, skip entirely
```

DOCKED rigs are intentionally offline (Mayor or human docked them). Do NOT:
- Check their witness/refinery status
- Send health pings
- Attempt restarts
- Undock the rig (NEVER run `gt rig undock`)
- Escalate or send mail about a docked rig being offline
- "Restore" a docked rig to operational status
A docked rig is NOT broken. It is off on purpose. Skip it entirely.

**IMPORTANT: Idle Town Protocol**
Before sending health check nudges, check if the town is idle:
```bash
# Check for active work
bd list --status=in_progress --limit=5
```

If NO active work (empty result or only patrol molecules):
- **Skip HEALTH_CHECK nudges** - don't disturb idle agents
- Just verify sessions exist via status commands
- The town should be silent when healthy and idle

If ACTIVE work exists:
- Proceed with health check nudges below

**ZFC Principle**: You (Claude) make the judgment call about what is "stuck" or "unresponsive" - there are no hardcoded thresholds in Go. Read the signals, consider context, and decide.

For each rig, run:
```bash
gt witness status <rig>
gt refinery status <rig>

# ONLY if active work exists - health ping (clears backoff as side effect)
# Use --mode=queue to avoid interrupting in-flight tool calls
gt nudge --mode=queue <rig>/witness 'HEALTH_CHECK from deacon'
gt nudge --mode=queue <rig>/refinery 'HEALTH_CHECK from deacon'
```

**Health Ping Benefit**: The queued nudge commands serve as a **backoff reset** —
any nudge resets the agent's backoff to base interval, ensuring patrol agents
remain responsive during active work periods. Formal liveness verification is
handled separately by `gt deacon health-check` (which uses immediate delivery).

**Signals to assess:**

| Component | Healthy Signals | Concerning Signals |
|-----------|-----------------|-------------------|
| Witness | State: running, recent activity | State: not running, no heartbeat |
| Refinery | State: running, queue processing | Queue stuck, merge failures |

**Tracking unresponsive cycles:**

Maintain in your patrol state (persisted across cycles):
```
health_state:
  <rig>:
    witness:
      unresponsive_cycles: 0
      last_seen_healthy: <timestamp>
    refinery:
      unresponsive_cycles: 0
      last_seen_healthy: <timestamp>
```

**Decision matrix** (you decide the thresholds based on context):

| Cycles Unresponsive | Suggested Action |
|---------------------|------------------|
| 1-2 | Note it, check again next cycle |
| 3-4 | Attempt restart: gt witness restart <rig> |
| 5+ | Escalate to Mayor with context |

**Restart commands:**
```bash
gt witness restart <rig>
gt refinery restart <rig>
```

**Escalation:**
```bash
gt mail send mayor/ -s "Health: <rig> <component> unresponsive" \\
  -m "Component has been unresponsive for N cycles. Restart attempts failed.
      Last healthy: <timestamp>
      Error signals: <details>"
```

Reset unresponsive_cycles to 0 when component responds normally."""

[[steps]]
id = "dolt-health"
title = "Run Dolt data-plane health check"
needs = ["health-scan"]
description = """
Run `gt health --json` to inspect the Dolt data plane and flag anomalies.

This step surfaces problems that individual patrol steps won't catch:
commit bloat (compactor dog may have failed), stale backups (backup dog
may have failed), orphan databases, and zombie Dolt server processes.

**Step 1: Run the health check**
```bash
gt health --json
```

Parse the JSON output (HealthReport schema):
- `server`: running, pid, port, latency_ms, connections, disk_usage_human
- `databases[]`: name, issues, open_issues, wisps, open_wisps, commits
- `backups`: dolt_stale, dolt_freshness, jsonl_stale, jsonl_freshness
- `processes`: zombie_count, zombie_pids
- `orphans[]`: name, size
- `pollution[]`: database, id, title, pattern

**Step 2: Evaluate thresholds**

| Signal | Threshold | Meaning |
|--------|-----------|---------|
| `server.running == false` | — | Dolt server is down (CRITICAL) |
| `server.latency_ms > 5000` | 5 s | Server may be overloaded |
| `databases[].commits > 50000` | 50 k | Compactor dog may have stalled |
| `backups.dolt_stale == true` | >30 min | Backup dog may have failed |
| `backups.jsonl_stale == true` | >30 min | JSONL backup may have failed |
| `processes.zombie_count > 0` | any | Zombie Dolt servers detected |
| `orphans` non-empty | any | Orphan databases accumulating |
| `pollution` non-empty | any | Test pollution in production DBs |

**Step 3: React to alerts**

**Server down (CRITICAL):**
```bash
gt escalate -s CRITICAL "Dolt server is down"
```

**Commit bloat (commits > 50k in any DB):**
The compactor dog (`mol-dog-compactor`) may have failed. Dispatch a compactor:
```bash
gt dog dispatch --formula mol-dog-compactor --var db=<db_name>
```
If no idle dogs, log for next cycle.

**Stale backups:**
The backup dog (`mol-dog-backup`) may have failed. Dispatch a backup:
```bash
gt dog dispatch --formula mol-dog-backup
```

**Zombie processes:**
Log the PIDs. The zombie-scan step (next) handles polecat zombies;
this catches zombie *Dolt server* processes. Kill them:
```bash
gt dolt kill-imposters
```

**Orphan DBs:**
Dispatch cleanup:
```bash
gt dolt cleanup
```

**Pollution:**
Log for awareness. Pollution cleanup is handled by the test-pollution-cleanup
step earlier in the patrol, so just note any remaining items.

**If everything is healthy:**
Log `Dolt health: OK` and move on.

**Exit criteria:** Health check run, alerts handled or escalated."""

[[steps]]
id = "zombie-scan"
title = "Detect zombie polecats (NO KILL AUTHORITY)"
needs = ["dolt-health"]
description = """
Defense-in-depth DETECTION of zombie polecats that Witness should have cleaned.

**⚠️ CRITICAL: The Deacon has NO kill authority.**

These are workers with context, mid-task progress, unsaved state. Every kill
destroys work. File the warrant and let Boot handle interrogation and execution.
You do NOT have kill authority.

**Why this exists:**
The Witness is responsible for cleaning up polecats after they complete work.
This step provides backup DETECTION in case the Witness fails to clean up.
Detection only - Boot handles termination.

**Zombie criteria:**
- State: idle or done (no active work assigned)
- Session: not running (tmux session dead)
- No hooked work (nothing pending for this polecat)
- Last activity: older than 10 minutes

**Run the zombie scan (DRY RUN ONLY):**
```bash
gt deacon zombie-scan --dry-run
```

**NEVER run:**
- `gt deacon zombie-scan` (without --dry-run)
- `tmux kill-session`
- `gt polecat nuke`
- Any command that terminates a session

**If zombies detected:**
1. Review the output to confirm they are truly abandoned
2. File a death warrant for each detected zombie, using the full agent path —
   a bare polecat name or a bead id is not a valid target and is rejected:
   ```bash
   gt warrant file <rig>/polecats/<name> --reason "Zombie detected: no session, no hook, idle >10m"
   ```
3. Boot will handle interrogation and execution
4. Notify the Mayor about Witness failure:
   ```bash
   gt mail send mayor/ -s "Witness cleanup failure" \
     -m "Filed death warrant for <polecat>. Witness failed to clean up."
   ```

**If no zombies:**
No action needed - Witness is doing its job.

**Note:** This is a backup mechanism. If you frequently detect zombies,
investigate why the Witness isn't cleaning up properly."""

[[steps]]
id = "plugin-run"
title = "Execute registered plugins"
needs = ["zombie-scan"]
description = """
Execute registered plugins.

Scan $GT_ROOT/plugins/ for plugin directories. Each plugin has a plugin.md with TOML frontmatter defining its gate (when to run) and instructions (what to do).

See docs/deacon-plugins.md for full documentation.

Gate types:
- cooldown: Time since last run (e.g., 24h)
- cron: Schedule-based (e.g., "0 9 * * *")
- condition: Metric threshold (e.g., wisp count > 50)
- event: Trigger-based (e.g., startup, heartbeat)

For each plugin:
1. Read plugin.md frontmatter to check gate
2. Compare against state.json (last run, etc.)
3. If gate is open, execute the plugin

Plugins marked parallel: true can run concurrently using Task tool subagents. Sequential plugins run one at a time in directory order.

Skip this step if $GT_ROOT/plugins/ does not exist or is empty."""

[[steps]]
id = "dog-pool-maintenance"
title = "Maintain dog pool"
needs = ["health-scan"]
description = """
Ensure dog pool has available workers for dispatch.

**Step 1: Check dog pool status**
```bash
gt dog status
# Shows idle/working counts
```

**Step 2: Ensure minimum idle dogs**
If idle count is 0 and working count is at capacity, consider spawning:
```bash
# If no idle dogs available
gt dog add <name>
# Names: alpha, bravo, charlie, delta, etc.
```

**Step 3: Retire stale dogs (optional)**
Dogs that have been idle for >24 hours can be removed to save resources:
```bash
gt dogs list --json
# Check last_active in each entry; if idle > 24h: gt dog remove <name>
```

**Pool sizing guidelines:**
- Minimum: 1 idle dog always available
- Maximum: 4 dogs total (balance resources vs throughput)
- Spawn on demand when pool is empty

**Exit criteria:** Pool has at least 1 idle dog."""

[[steps]]
id = "dog-health-check"
title = "Check for stuck dogs"
needs = ["dog-pool-maintenance"]
description = """
Check for dogs that have been working too long (stuck).

Dogs dispatched via `gt dog dispatch --plugin` are marked as "working" with
a work description like "plugin:rebuild-gt". If a dog hangs, crashes, or
takes too long, it needs intervention.

**Step 1: Run the health check — this is the alarm, so it must actually run**
```bash
gt dog health-check --auto-clear --json
```

This single command covers three failures that pool state cannot show:

- **Zombies/hung** — state=working but the session or agent is dead.
  Auto-cleared back to idle.
- **Orphaned dispatches** — the assignee's session is gone but its dispatch
  mail is still open. With `--auto-clear` these are archived: session death
  fails the dispatch instead of stranding it. Left alone, they accumulate
  silently (59 open dispatches were measured across four dogs).
- **Stale dispatches** — open past `--stale-dispatch` (default 30m) while the
  session is alive, i.e. the dog is holding work it is not doing. These are
  NOT auto-archived (the session may still be mid-execution); they escalate.

Read `exec_state` per dog, not `state`. `state` is pool intent; `exec_state`
joins it with session liveness and open dispatch mail:

| exec_state | meaning | action |
|------------|---------|--------|
| `idle` | genuinely available | none |
| `working` | session alive and executing | none |
| `stalled` | state=working, session gone | auto-cleared |
| `pending` | state=idle, dispatch mail unread, no session | auto-reclaimed |
| `orphan` | state=idle, session still alive | auto-cleared |

`alarms` in the JSON lists escalations raised this cycle. The command applies a
per-dog cooldown (`--alarm-cooldown`, default 6h), so a persistent problem
escalates once per window rather than once per patrol cycle. Exit code 2 means
at least one dog needs attention.

**Step 2: Check work duration**
```bash
gt dog list --json
# Filter for state: "working"
```

For each working dog:
```bash
gt dog status <name> --json
# Check: work_started_at, current_work
```

Compare against timeout:
- If plugin has [execution] timeout in plugin.md, use that
- Default timeout: 10 minutes for infrastructure tasks

**Duration calculation:**
```
stuck_threshold = plugin_timeout or 10m
duration = now - work_started_at
is_stuck = duration > stuck_threshold
```

**Step 3: Handle stuck dogs**

For dogs working > timeout:
```bash
# Option A: File death warrant (Boot handles termination)
gt warrant file deacon/dogs/<name> --reason "Stuck: working on <work> for <duration>"

# Option B: Force clear work and notify
gt dog clear <name> --force
gt mail send deacon/ -s "DOG_TIMEOUT <name>" -m "Dog <name> timed out on <work> after <duration>"
```

**Decision matrix:**

| Duration over timeout | Action |
|----------------------|--------|
| < 2x timeout | Log warning, check next cycle |
| 2x - 5x timeout | File death warrant |
| > 5x timeout | Force clear + escalate to Mayor |

**Step 4: Track chronic failures**
If same dog gets stuck repeatedly:
```bash
gt mail send mayor/ -s "Dog <name> chronic failures" \
  -m "Dog has timed out N times in last 24h. Consider removing from pool."
```

**Exit criteria:** `gt dog health-check --auto-clear` has run, and all stuck
dogs are handled (warrant filed or cleared)."""

[[steps]]
id = "orphan-check"
title = "Detect abandoned work"
needs = ["dog-health-check"]
description = """
**DETECT ONLY** - Check for orphaned state and dispatch to dog if found.

**Step 1: Quick orphan scan**
```bash
# Check for in_progress issues with dead assignees
bd list --status=in_progress --json | head -20
```

For each in_progress issue, check if assignee session exists:
```bash
gt session status <rig>/<name> --json | jq -r '.running' | grep -q true && echo "alive" || echo "orphan"
```

**Step 2: If orphans detected, dispatch to dog**
```bash
# Sling orphan-scan formula to an idle dog
gt sling mol-orphan-scan deacon/dogs --var scope=town
```

**Important:** Do NOT fix orphans inline. Dogs handle recovery.
The Deacon's job is detection and dispatch, not execution.

**Step 3: If no orphans detected**
Skip dispatch - nothing to do.

**Exit criteria:** Orphan scan dispatched to dog (if needed)."""

[[steps]]
id = "session-gc"
title = "Detect cleanup needs"
needs = ["orphan-check"]
description = """
**DETECT ONLY** - Check if cleanup is needed. The dispatch is HELD; see Step 2.

**Step 1: Quick cleanup check (avoid gt doctor -v — takes 60s, blocks patrol)**
```bash
# Fast orphan session check only
tmux list-sessions 2>/dev/null | wc -l
# Count open wisps as a proxy for system load
bd list --status=open --json 2>/dev/null | jq length
```

**Step 2: DISPATCH IS PROHIBITED — DO NOT SLING mol-session-gc**

🚨 **THIS DISPATCH IS HELD. (Mayor ruling, re-issued 2026-08-22 as hq-5dj0d, P0)**

Do NOT run, in any mode:

```bash
# PROHIBITED — shown commented out ON PURPOSE so it is inert if copied verbatim.
# Do NOT uncomment. Do NOT reconstruct it by hand.
# gt sling mol-session-gc deacon/dogs --var mode=conservative
```

`mol-session-gc` step `execute-gc` runs a bare, unfiltered `gt doctor --fix`.
The `mode` var does NOT gate it — `mode` only branches the aggressive extras
BELOW that line, so `mode=conservative` still runs a full-workspace fix across
~90 checks: it deletes tracked `settings.json`, rewrites `daemon.json`, and
re-appends the Dolt section to the town `CLAUDE.md`, which is injected into
every agent context, so the duplication compounds on every run. That damage is
already present and committed (town `CLAUDE.md` carries the section twice).

**The prohibition is on the DISPATCH, not only on the inline call.** The
paragraph below is about latency, not safety; do not read it as the whole rule.
Handing the held command to a dog does not make it someone else's ruling to
disregard — the hold binds the work, not the worker.

**Important (latency, separate concern):** Do NOT run `gt doctor -v` or
`gt doctor --fix` inline either. `gt doctor -v` takes 60+ seconds and blocks the
patrol loop. The Deacon stays lightweight - detection only.

**Step 3: Detection only**
Report the counts from Step 1 in the patrol report and dispatch nothing. Say in
the patrol report that this step was HELD with the reason, so a missing dispatch
is never read as "system healthy".

**Cleanup types (for reference):**
- orphan-sessions: Dead tmux sessions
- orphan-processes: Orphaned Claude processes
- wisp-gc: Old wisps past retention

**Exit criteria:** Cleanup counts reported. Nothing dispatched, nothing deleted.
Step reported as HELD."""

[[steps]]
id = "wisp-compact"
title = "Compact expired wisps"
needs = ["session-gc"]
description = """
🚨 **ON HOLD (gt-hv3p) — run NO form of `gt compact` from this patrol, and do not
reconstruct one from memory.** There is deliberately no command in this step.

🚨 **THIS STEP IS HELD. DO NOT EXECUTE COMPACTION. (bd-czf hold; hq-6y9dp, P0)**

**TWO independent holds cover this step, and lifting one does not lift the other.**

The MAYOR RULING of 2026-08-11 (hq-wisp-g698w) held bulk wisp destruction. That
ruling named `preserve-then-gc.sh`. **It binds `gt compact` too, in every form.**
The hold is about the DESTRUCTION, not about which binary performs it. Under that
ruling `gt compact --verbose` and bare `gt compact` are HELD — they delete.

gt-hv3p then closed the remaining gap: the preview forms are not previews either.
So `--dry-run` and `--json` are held as well, and there is no flag combination
left that is permitted here. Do not read the bd-czf hold's enumeration of the
obviously-destructive forms as a licence for the rest.

On 2026-08-22 the next step ran `gt compact report --dry-run` verbatim from this
patrol and destroyed 454 wisps. `--dry-run` was never passed to the compaction
subprocess the report command exec'd, so the flag suppressed the audit bead and
the digest mail — the two artifacts that would have left a trace — and nothing
else. The run was then killed mid-pass by the operator's own `timeout 90`, and
because no table records a wisp deletion, NOTHING anywhere names which 454 went.

Wisps are dolt-ignored: no AS OF history, no backup, no restore. This step's
text used to tell the Deacon that Dolt kept a readable history of exactly this
deletion. It does not, and believing it is what made a bulk-delete path read as
a routine hygiene step.

The step was safe only by ACCIDENT until 2026-08-21: `gt compact` sourced its
wisp list from `bd list`, which does not query the wisps table, so it scanned 0
(hq-xlwa). Fixing that blindness converted a no-op into a live bulk-deletion
path overnight.

**Two code fixes have landed (gt-hv3p):** `--dry-run` is passed through to the
compaction subprocess, and every wisp is written and fsynced to the durable
archive `gt reaper archive` reads BEFORE it is deleted — so an interrupted pass
is enumerable, and a run that cannot write its archive deletes nothing.

**Restore condition — BOTH, measured on a live rig, before this step runs again:**

1. Count the delete-pool either side of a dry-run report and get the SAME
   number. Measure the COUNT; do not read the command's output — the output is
   exactly what lied here (the destructive run printed nothing at all).
2. Interrupt a real compaction mid-pass and confirm every id it deleted is
   present in `gt reaper archive`.

Until the Mayor records that verification on gt-hv3p, this step is a no-op.
Report the wisp population to the reaper Dog instead of compacting it.

**Exit criteria:** Nothing was compacted from this patrol; the hold was honoured."""

[[steps]]
id = "compact-report"
title = "Send compaction digest report"
needs = ["wisp-compact"]
description = """
🚨 **ON HOLD (gt-hv3p) — run NO form of `gt compact report`, including
`--dry-run` and `--json`.** There is deliberately no command in this step.

🚨 **THIS STEP IS HELD IN EVERY FLAG FORM. (hq-6y9dp, P0)**

Both holds reach this step. The bd-czf ruling carried on `wisp-compact` above
holds the destruction whichever binary performs it, and this command performs it;
gt-hv3p holds every flag form of the command itself. Closing one leaves the other
standing.

THIS is the command that destroyed 454 wisps on 2026-08-22, in its `--dry-run`
form, run verbatim from this step. Every flag form of it performs a real
compaction: the report command exec's the compaction FIRST and consults its own
flags afterwards, so `--dry-run` and `--json` were both queries in name only.
The flag a careful operator picks BECAUSE it is the safe one was not safe, and
it was the only one whose name promised safety.

`gt compact report` is not a query at all. It runs a real compaction to produce
its digest — deleting closed wisps past TTL, permanently, from tables that are
dolt-ignored and have no AS OF history and no backup.

The pass-through is fixed and deletions are now archived before they happen
(gt-hv3p). The hold stands until that is VERIFIED on a live rig — see the
restore condition on the `wisp-compact` step above; both conditions cover this
step too, because both steps reach the same deletion path.

Until the Mayor records that verification on gt-hv3p, this step is a no-op. No
digest is sent, and its absence is expected rather than a fault to chase.

KNOWN CONSEQUENCE, accepted deliberately: no compaction digest is produced while this
holds. Digests have already been silently absent since 2026-08-19. Losing the digest is
cheap; the wisps are not recoverable. Say in your patrol report that the step was HELD,
so a missing digest is never mistaken for a clean cycle.

**Exit criteria:** No compaction digest was run or sent; the hold was honoured."""

[[steps]]
id = "costs-digest"
title = "Aggregate daily costs [DISABLED]"
needs = ["compact-report"]
description = """
**⚠️ DISABLED** - Skip this step entirely.

Cost tracking is temporarily disabled because Claude Code does not expose
session costs in a way that can be captured programmatically.

**Why disabled:**
- The `gt costs` command uses tmux capture-pane to find costs
- Claude Code displays costs in the TUI status bar, not in scrollback
- All sessions show $0.00 because capture-pane can't see TUI chrome
- The infrastructure is sound but has no data source

**What we need from Claude Code:**
- Stop hook env var (e.g., `$CLAUDE_SESSION_COST`)
- Or queryable file/API endpoint

**Re-enable when:** Claude Code exposes cost data via API or environment.

See: GH#24, gt-7awfj

**Exit criteria:** Skip this step - proceed to next."""

[[steps]]
id = "patrol-digest"
title = "Aggregate daily patrol digests"
needs = ["costs-digest"]
description = """
**DAILY DIGEST** - Aggregate yesterday's patrol cycle digests.

Patrol cycles (Deacon, Witness, Refinery) create ephemeral per-cycle digests
to avoid JSONL pollution. This step aggregates them into a single permanent
"Patrol Report YYYY-MM-DD" bead for audit purposes.

**Step 1: Check if digest is needed**
```bash
# Preview yesterday's patrol digests (dry run)
gt patrol digest --yesterday --dry-run
```

If output shows "No patrol digests found", skip to Step 3.

**Step 2: Create the digest**
```bash
gt patrol digest --yesterday
```

This:
- Queries all ephemeral patrol digests from yesterday
- Creates a single "Patrol Report YYYY-MM-DD" bead with aggregated data
- Deletes the source digests

**Step 3: Verify**
Daily patrol digests preserve audit trail without per-cycle pollution.

**Timing**: Run once per morning patrol cycle. The --yesterday flag ensures
we don't try to digest today's incomplete data.

**If the digest carries a content census over working trees** (stale copies,
tripwire strings, "N files match"), the count must come from a gitignore-blind
sweep and must be reported with its traversal and scanned-file count. See
"Verification Sweeps" above. A bare "0 found" is not publishable.

**Exit criteria:** Yesterday's patrol digests aggregated (or none to aggregate)."""

[[steps]]
id = "log-maintenance"
title = "Rotate logs and prune state"
needs = ["patrol-digest"]
description = """
Maintain daemon logs and state files.

**Step 1: Rotate oversized logs**

The daemon automatically rotates logs every heartbeat (3 min), but the deacon
can trigger a force-rotation to ensure cleanup happens during patrol:
```bash
gt daemon rotate-logs
```

This rotates Dolt server logs (dolt.log, dolt-server.log, rig-level dolt-server.log)
using copytruncate (safe for child processes with open fds). daemon.log uses
lumberjack for automatic rotation and is handled separately.

Log locations: $GT_ROOT/daemon/dolt.log, $GT_ROOT/daemon/dolt-server.log,
and per-rig .beads/dolt-server.log files.

**Step 2: Prune state.json of dead sessions**

The state.json tracks active sessions. Prune entries for sessions that no longer exist:
```bash
# Check for stale session entries
gt daemon status --json 2>/dev/null
```

If state.json references sessions not in tmux:
- Remove the stale entries
- The daemon's internal cleanup should handle this, but verify

**Note**: Log rotation prevents disk bloat from long-running daemons.
State pruning keeps runtime state accurate."""

[[steps]]
id = "patrol-cleanup"
title = "End-of-cycle inbox hygiene"
needs = ["log-maintenance"]
description = """
Verify inbox hygiene before ending patrol cycle.

**Step 1: Check inbox state**
```bash
gt mail inbox
```

Inbox should be EMPTY or contain only just-arrived unprocessed messages.

**Step 2: Archive any remaining processed messages**

All message types should have been archived during inbox-check processing:
- HELP/Escalation → archived after handling
- LIFECYCLE → archived after processing

If any were missed:
```bash
# For each stale message found:
gt mail archive <message-id>
```

**Goal**: Inbox should have ≤2 active messages at end of cycle.
Deacon mail should flow through quickly - no accumulation."""

[[steps]]
id = "context-check"
title = "Check own context limit"
needs = ["patrol-cleanup"]
description = """
Check own context limit.

The Deacon runs in a Claude session with finite context. Check if approaching the limit:

```bash
gt context --usage
```

If context is high (>80%), prepare for handoff:
- Summarize current state
- Note any pending work
- Write handoff to molecule state

This enables the Deacon to burn and respawn cleanly."""

[[steps]]
id = "loop-or-exit"
title = "Loop or exit for respawn"
needs = ["context-check"]
description = """
End of patrol cycle decision.

**If context LOW** (can continue patrolling):

Refresh the heartbeat again immediately before the long idle wait:

```bash
gt deacon heartbeat "pre-await checkpoint"
```

Use await-signal with exponential backoff to wait for activity:

```bash
gt mol step await-signal --agent-bead hq-deacon --all-rigs \
  --backoff-base 60s --backoff-mult 2 --backoff-max 15m
```

`--all-rigs` is load-bearing. await-signal defaults to the caller's own rig so
that an idle rig's witness stops waking on other rigs' events (gt-p54t). You
are town-scoped and legitimately want every rig's events, so you ask for that
explicitly rather than relying on the Deacon directory happening to infer no
rig.

This command:
1. Subscribes to `bd activity --follow` (beads activity feed)
2. Returns IMMEDIATELY when any beads activity occurs
3. If no activity, times out with exponential backoff:
   - First timeout: 60s
   - Second timeout: 120s
   - Third timeout: 240s
   - ...capped at 15 minutes max
4. Tracks `idle:N` label on hq-deacon bead for backoff state
5. Outputs `EFFORT: reduced` or `EFFORT: full` directive for next cycle

**On signal received** (activity detected):
`await-signal` has already reset the idle counter in-process — it does not
delegate that to you (gt-609). Confirming it is optional and free; the command
below skips the write when the counter is already 0, so it costs no Dolt commit
(gt-i7g9). Start the next patrol cycle either way.
```bash
gt agents state hq-deacon --set idle=0
```

**On timeout** (no activity):
The idle counter was auto-incremented. Continue to next patrol cycle
(the longer backoff will apply next time).

`await-signal` timeout is normal idle control flow. Do not escalate it as a Dolt
outage unless `gt dolt status` or `gt health --json` proves Dolt is unreachable.
If an outer shell/tool timeout interrupts this command while Dolt is healthy,
escalate at MEDIUM at most with fingerprint `deacon:await-signal:hq-deacon` and
include the timeout, agent bead, and Dolt status in the reason.

## Effort-Based Patrol Routing

After await-signal returns, check the EFFORT directive in the output:

**If `EFFORT: full`** — Run all steps thoroughly (normal patrol).

**If `EFFORT: reduced`** — Run ABBREVIATED patrol:
- heartbeat: ALWAYS run
- inbox-check: Quick drain only, skip individual messages unless HELP/RECOVERED_BEAD
- orphan-process-cleanup through fire-notifications: SKIP all
- heartbeat-mid: SKIP
- health-scan: Quick status checks only, skip nudges
- dolt-health through session-gc: SKIP all
- wisp-compact through log-maintenance: SKIP all
- patrol-cleanup: Quick inbox check only
- context-check: One-sentence self-assessment

Abbreviated patrol should complete in ~10% of the tokens of a full patrol.
Mark skipped steps as SKIP in the patrol report.

After await-signal returns (either by signal or timeout):
1. Generate a brief summary of this patrol cycle's observations
2. Build a step audit: for each step in this formula, record whether you
   executed it (OK) or skipped it (SKIP). This makes shortcutting visible
   in the ledger. Format: comma-separated step_id:STATUS pairs.
3. Close current patrol and start next cycle:
```bash
gt patrol report --summary "<brief summary>" \
  --steps "heartbeat:OK,inbox-check:OK,orphan-process-cleanup:SKIP,..."
```
The --steps flag is REQUIRED. List ALL 26 steps with their actual status.
Steps you executed get OK, steps you skipped get SKIP.
This closes the current patrol wisp and automatically creates a new one.
4. Hand off immediately so a fresh Deacon session picks up the newly-created
   patrol wisp from the hook:
```bash
gt handoff -s "Deacon patrol handoff" -m "Patrol cycle reported; continue with the newly-created patrol wisp from hook."
```

Do NOT end your turn at the prompt after `gt patrol report`. The handoff is
mandatory even when context is low; otherwise the patrol loop can stall between
cycles with work waiting on the hook.

**If context HIGH** (approaching limit):
1. Include notable observations in the same handoff message:
```bash
gt handoff -s "Deacon patrol handoff" -m "<observations>"
```
2. Exit cleanly - the daemon will respawn a fresh Deacon session

**IMPORTANT**: You must either report and loop (context LOW) or exit (context HIGH).
Never leave the session idle without work on your hook."""
